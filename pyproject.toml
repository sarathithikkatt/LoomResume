[project]
name = "loom-resume-app"
version = "0.1.0"
description = "FastAPI backend with interchangeable LLM providers (OpenAI, Claude, Grok, Ollama, llama.cpp)"
authors = [{ name = "Sarath" }]
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",

    # LLM — unified provider via LiteLLM
    "litellm>=1.40.0",
    "langchain-openai>=0.1.22",   # kept for embedding_service only
    "httpx>=0.27.0",

    # Config
    "python-dotenv>=1.0.1",
    "pydantic-settings>=2.3.4",

    # Validation
    "pydantic>=2.8.0",

    # Database
    "sqlalchemy>=2.0.31",
    "psycopg2-binary>=2.9.9",
    "langchain-postgres>=0.0.9",

    # Rendering
    "weasyprint>=62.3",
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*"]

[project.optional-dependencies]
dev = [
    # Testing
    "alembic>=1.12.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",

    # Linting
    "ruff>=0.5.0",

    # Formatting
    "black>=24.4.0",

    # Type checking
    "mypy>=1.10.0",

    # Coverage
    "pytest-cov>=5.0.0",
]

# ⚙️ TOOL CONFIGURATIONS

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"

# Enable useful rule sets
lint.select = [
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # import sorting
    "B",  # bugbear
    "UP", # pyupgrade
]

lint.ignore = [
    "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]


[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true


[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]


[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"